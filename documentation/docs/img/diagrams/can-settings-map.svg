<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="t d">
  <title id="t">What each CAN setting gates</title>
  <desc id="d">CAN1 and CAN2 feed one receive thread per bus when CAN read enabled is on; received frames
  fan out to the CAN wideband and EGT sensors, OEM vehicle speed, dash and Lua listeners, and the sniffer
  that streams to the second USB serial port. One transmit worker running every five ms feeds the bus from
  the rusEFI broadcast, the OEM cluster protocol and the wideband status message, gated by CAN write
  enabled.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <text x="20" y="26">CAN Bus Settings: what each switch gates</text>

  <!-- the two buses -->
  <rect class="box" x="20" y="115" width="170" height="100" rx="6"/>
  <text x="105" y="145" text-anchor="middle">CAN1 · CAN2</text>
  <text x="105" y="165" text-anchor="middle" class="mono">Black 17 H · 16 L</text>
  <text x="105" y="183" text-anchor="middle" class="mono">Black 22 H · 21 L</text>
  <text x="105" y="205" text-anchor="middle" class="small">one twisted pair each</text>

  <!-- receive path -->
  <rect class="loop" x="250" y="110" width="140" height="60" rx="6"/>
  <text x="320" y="136" text-anchor="middle">RX thread</text>
  <text x="320" y="154" text-anchor="middle" class="small">one per bus</text>
  <path class="wire-loop" d="M190,135 H250" marker-end="url(#a)"/>

  <rect class="safe" x="250" y="62" width="140" height="28" rx="6"/>
  <text x="320" y="80" text-anchor="middle" class="small">CAN read enabled</text>
  <path class="wire-safe" d="M320,90 V110" marker-end="url(#a)"/>

  <rect class="loop" x="450" y="35" width="240" height="46" rx="6"/>
  <text x="570" y="55" text-anchor="middle">wideband lambda · EGT</text>
  <text x="570" y="73" text-anchor="middle" class="small">CAN O2 sensors · CAN EGT</text>

  <rect class="loop" x="450" y="95" width="240" height="46" rx="6"/>
  <text x="570" y="115" text-anchor="middle">OEM vehicle speed</text>
  <text x="570" y="133" text-anchor="middle" class="small">CAN Vehicle speed sensor</text>

  <rect class="loop" x="450" y="155" width="240" height="46" rx="6"/>
  <text x="570" y="175" text-anchor="middle">dash data · IMU · Lua</text>
  <text x="570" y="193" text-anchor="middle" class="small">OBD-II requests · canRxAdd</text>

  <rect class="loop" x="450" y="215" width="240" height="46" rx="6"/>
  <text x="570" y="235" text-anchor="middle">sniffer text stream</text>
  <text x="570" y="253" text-anchor="middle" class="small">second USB serial port</text>

  <path class="wire-loop" d="M390,130 L450,58" marker-end="url(#a)"/>
  <path class="wire-loop" d="M390,136 L450,118" marker-end="url(#a)"/>
  <path class="wire-loop" d="M390,144 L450,178" marker-end="url(#a)"/>
  <path class="wire-loop" d="M390,150 L450,238" marker-end="url(#a)"/>

  <!-- transmit path -->
  <rect class="drive" x="250" y="285" width="140" height="60" rx="6"/>
  <text x="320" y="311" text-anchor="middle">TX worker</text>
  <text x="320" y="329" text-anchor="middle" class="small">every 5 ms</text>
  <path class="wire-drive" d="M250,300 L190,205" marker-end="url(#a)"/>

  <rect class="safe" x="250" y="365" width="140" height="28" rx="6"/>
  <text x="320" y="383" text-anchor="middle" class="small">CAN write enabled</text>
  <path class="wire-safe" d="M320,365 V345" marker-end="url(#a)"/>

  <rect class="drive" x="450" y="270" width="240" height="46" rx="6"/>
  <text x="570" y="290" text-anchor="middle">rusEFI broadcast</text>
  <text x="570" y="308" text-anchor="middle" class="small">base address · period · bus</text>

  <rect class="drive" x="450" y="330" width="240" height="46" rx="6"/>
  <text x="570" y="350" text-anchor="middle">cluster · dash protocol</text>
  <text x="570" y="368" text-anchor="middle" class="small">CAN dash type</text>

  <rect class="drive" x="450" y="390" width="240" height="46" rx="6"/>
  <text x="570" y="410" text-anchor="middle">wideband status</text>
  <text x="570" y="428" text-anchor="middle" class="small">heater allow · volts, 50 ms</text>

  <path class="wire-drive" d="M450,293 L390,305" marker-end="url(#a)"/>
  <path class="wire-drive" d="M450,353 L390,315" marker-end="url(#a)"/>
  <path class="wire-drive" d="M450,413 L390,325" marker-end="url(#a)"/>

  <text x="20" y="455" class="small">Burn is not enough for read, write, listen mode or wideband changes — power-cycle the ECU.</text>
</svg>
