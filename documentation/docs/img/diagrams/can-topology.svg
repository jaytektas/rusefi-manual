<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d">
  <title id="t">CAN bus topology</title>
  <desc id="d">A linear CAN bus: two twisted wires, CAN High and CAN Low, with a 120 ohm terminator at each physical end. Proteus, a dash and a wideband controller connect as short stubs.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <path class="wire-loop" d="M110,100 H790"/><text x="450" y="92" text-anchor="middle" class="small">CAN High (green wire)</text>
  <path class="wire-ask" d="M110,140 H790"/><text x="450" y="160" text-anchor="middle" class="small">CAN Low (blue wire)</text>
  <rect class="safe" x="40" y="85" width="70" height="70" rx="6"/><text x="75" y="118" text-anchor="middle">120 Ω</text><text x="75" y="136" text-anchor="middle" class="small">end</text>
  <rect class="safe" x="790" y="85" width="70" height="70" rx="6"/><text x="825" y="118" text-anchor="middle">120 Ω</text><text x="825" y="136" text-anchor="middle" class="small">end</text>
  <rect class="drive" x="160" y="190" width="200" height="56" rx="6"/><text x="260" y="213" text-anchor="middle">Proteus CAN1</text><text x="260" y="231" text-anchor="middle" class="mono">Black 17 H · Black 16 L</text>
  <rect class="box" x="400" y="190" width="160" height="56" rx="6"/><text x="480" y="222" text-anchor="middle">dash</text>
  <rect class="box" x="600" y="190" width="170" height="56" rx="6"/><text x="685" y="222" text-anchor="middle">wideband controller</text>
  <path class="wire" d="M240,100 V190 M280,140 V190 M460,100 V190 M500,140 V190 M665,100 V190 M705,140 V190"/>
  <text x="450" y="30" text-anchor="middle">Total resistance between H and L, power off: about 60 Ω</text>
</svg>
