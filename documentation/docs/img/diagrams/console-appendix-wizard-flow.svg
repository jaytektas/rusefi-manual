<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d">
  <title id="t">rusEFI console Setup Wizard flow</title>
  <desc id="d">The wizard starts from its button or by itself when a step is unfinished, begins at the
  first unfinished step, and walks twelve questions. Each answer is patched into the tune and burned at
  once, and a wizard flag in the tune marks that step done, so the next start resumes where you left off.
  The Ignition Outputs and Injector Outputs steps can test outputs, which is the safety path.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 10px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- how it starts -->
  <rect class="ask" x="16" y="16" width="212" height="56" rx="6"/>
  <text x="122" y="40" text-anchor="middle">Launch Wizard button</text>
  <text x="122" y="58" text-anchor="middle" class="small">top right, beside the connection icon</text>

  <rect class="ask" x="248" y="16" width="212" height="56" rx="6"/>
  <text x="354" y="40" text-anchor="middle">Opens by itself on connect</text>
  <text x="354" y="58" text-anchor="middle" class="small">when a wizard flag is still "no"</text>

  <rect class="loop" x="480" y="16" width="212" height="56" rx="6"/>
  <text x="586" y="40" text-anchor="middle">first unfinished step</text>
  <text x="586" y="58" text-anchor="middle" class="small">steps marked "yes" are skipped</text>

  <rect class="box" x="712" y="16" width="232" height="56" rx="6"/>
  <text x="828" y="40" text-anchor="middle">Wizard Complete!</text>
  <text x="828" y="58" text-anchor="middle" class="small">Return to Console</text>

  <path class="wire-ask" d="M228,44 H246" marker-end="url(#a)"/>
  <path class="wire-ask" d="M460,44 H478" marker-end="url(#a)"/>
  <path class="wire" d="M692,44 H710" marker-end="url(#a)"/>

  <!-- twelve questions -->
  <path class="wire-ask" d="M586,72 V96 H120 V108" marker-end="url(#a)"/>
  <text x="300" y="92" class="small">twelve numbered steps, in this order</text>

  <g>
    <rect class="ask" x="16" y="110" width="210" height="44" rx="5"/>
    <text x="24" y="128">1 · Cylinders</text>
    <text x="24" y="145" class="mono">cylindersCount · twoStroke</text>

    <rect class="ask" x="238" y="110" width="210" height="44" rx="5"/>
    <text x="246" y="128">2 · Firing Order</text>
    <text x="246" y="145" class="mono">firingOrder</text>

    <rect class="ask" x="460" y="110" width="210" height="44" rx="5"/>
    <text x="468" y="128">3 · Base VE Table</text>
    <text x="468" y="145" class="mono">veTable (generated)</text>

    <rect class="ask" x="682" y="110" width="210" height="44" rx="5"/>
    <text x="690" y="128">4 · Engine Displacement</text>
    <text x="690" y="145" class="mono">displacement (litres)</text>

    <rect class="ask" x="16" y="160" width="210" height="44" rx="5"/>
    <text x="24" y="178">5 · MAP Sensor</text>
    <text x="24" y="195" class="mono">map_sensor_hwChannel</text>

    <rect class="ask" x="238" y="160" width="210" height="44" rx="5"/>
    <text x="246" y="178">6 · TPS</text>
    <text x="246" y="195" class="mono">tps1_1AdcChannel · tpsMin/Max</text>

    <rect class="ask" x="460" y="160" width="210" height="44" rx="5"/>
    <text x="468" y="178">7 · CLT Sensor</text>
    <text x="468" y="195" class="mono">clt_adcChannel · clt_tempC_1..3</text>

    <rect class="ask" x="682" y="160" width="210" height="44" rx="5"/>
    <text x="690" y="178">8 · Crank Trigger</text>
    <text x="690" y="195" class="mono">trigger_type · triggerInputPins1</text>

    <rect class="ask" x="16" y="210" width="210" height="44" rx="5"/>
    <text x="24" y="228">9 · Cam Trigger</text>
    <text x="24" y="245" class="mono">camInputs1 · vvtMode1</text>

    <rect class="ask" x="238" y="210" width="210" height="44" rx="5"/>
    <text x="246" y="228">10 · Ignition Outputs</text>
    <text x="246" y="245" class="mono">ignitionPins1..N</text>

    <rect class="ask" x="460" y="210" width="210" height="44" rx="5"/>
    <text x="468" y="228">11 · Injector Outputs</text>
    <text x="468" y="245" class="mono">injectionPins1..N</text>

    <rect class="ask" x="682" y="210" width="210" height="44" rx="5"/>
    <text x="690" y="228">12 · Injector Flow</text>
    <text x="690" y="245" class="mono">injector_flow</text>
  </g>

  <!-- what each answer does -->
  <path class="wire-drive" d="M120,254 V274 H330 V288" marker-end="url(#a)"/>
  <rect class="drive" x="16" y="290" width="440" height="66" rx="6"/>
  <text x="36" y="314">written and burned at once</text>
  <text x="36" y="332" class="small">the changed bytes are sent to the ECU and the ECU commits them;</text>
  <text x="36" y="347" class="small">there is no separate Save or Burn button in the wizard</text>

  <rect class="loop" x="476" y="290" width="468" height="66" rx="6"/>
  <text x="496" y="314">a flag in your tune marks the step done</text>
  <text x="496" y="332" class="small">wizard flags are bits in your tune: wizardNumberOfCylinders,</text>
  <text x="496" y="347" class="small">wizardTps … wizardVeTable — they travel with the tune</text>

  <path class="wire-loop" d="M944,323 H952 V90 H560 V74" marker-end="url(#a)"/>
  <text x="16" y="375" class="small">changing the cylinder count clears the Firing Order, Ignition Outputs and Injector Outputs flags</text>

  <!-- safety -->
  <path class="wire-safe" d="M900,388 V264 H674" marker-end="url(#a)"/>
  <rect class="safe" x="16" y="390" width="884" height="56" rx="6"/>
  <text x="36" y="414">steps 10 and 11 can fire the coils and spray the injectors</text>
  <text x="36" y="432" class="small">the console waits for "I understand the risks - enable bench tests"; the firmware refuses</text>
  <text x="610" y="432" class="small">the test while the engine is running</text>
</svg>
