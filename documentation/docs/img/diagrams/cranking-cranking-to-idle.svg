<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">Cranking to idle timeline</title>
  <desc id="d">Key on: priming pulse after the priming delay. Cranking: cranking fuel, cranking timing and dwell, cranking idle air. At the cranking RPM limit the engine is running: running fuel with after-start enrichment until its cycle count ends, and idle air tapers from the cranking position to the running position over the taper cycles, then closed-loop idle starts.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <path class="wire" d="M40,60 H930" marker-end="url(#a)"/>
  <text x="930" y="50" text-anchor="end" class="small">time / engine cycles →</text>
  <text x="60" y="45" class="small">key on</text>
  <text x="200" y="45" class="small">starter</text>
  <text x="420" y="45" class="small">RPM ≥ cranking_rpm</text>
  <path class="wire-safe" d="M420,60 V300"/>
  <rect class="ask" x="40" y="80" width="140" height="56" rx="6"/>
  <text x="110" y="104" text-anchor="middle">Priming pulse</text>
  <text x="110" y="122" text-anchor="middle" class="mono">primingDelay + 0.1 s</text>
  <rect class="drive" x="190" y="80" width="225" height="56" rx="6"/>
  <text x="302" y="104" text-anchor="middle">Cranking fuel</text>
  <text x="302" y="122" text-anchor="middle" class="small">base mass × CLT mult × TPS mult</text>
  <rect class="drive" x="425" y="80" width="300" height="56" rx="6"/>
  <text x="575" y="104" text-anchor="middle">Running fuel × after-start enrichment</text>
  <text x="575" y="122" text-anchor="middle" class="small">until cycle count passes the ASE table</text>
  <rect class="box" x="735" y="80" width="190" height="56" rx="6"/>
  <text x="830" y="104" text-anchor="middle">Running fuel</text>
  <text x="830" y="122" text-anchor="middle" class="small">warm-up (CLT) only</text>
  <rect class="drive" x="190" y="150" width="225" height="56" rx="6"/>
  <text x="302" y="174" text-anchor="middle">Cranking timing + dwell</text>
  <text x="302" y="192" text-anchor="middle" class="small">fixed angle tapered, or table</text>
  <rect class="box" x="425" y="150" width="500" height="56" rx="6"/>
  <text x="675" y="182" text-anchor="middle">Running ignition table (+ idle timing PID when idling)</text>
  <rect class="loop" x="190" y="220" width="225" height="56" rx="6"/>
  <text x="302" y="244" text-anchor="middle">Idle: Cranking</text>
  <text x="302" y="262" text-anchor="middle" class="small">Cranking Air Amount vs CLT</text>
  <rect class="loop" x="425" y="220" width="300" height="56" rx="6"/>
  <text x="575" y="244" text-anchor="middle">Idle: CrankToIdleTaper</text>
  <text x="575" y="262" text-anchor="middle" class="small">blend cranking → running position, no PID</text>
  <rect class="loop" x="735" y="220" width="190" height="56" rx="6"/>
  <text x="830" y="244" text-anchor="middle">Idle: Idling</text>
  <text x="830" y="262" text-anchor="middle" class="small">open loop + PID</text>
  <text x="40" y="318" class="small">Engine-cycle counter starts with cranking and runs through both ASE and the taper; it resets only when the engine stops.</text>
</svg>
