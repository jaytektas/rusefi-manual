<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 386" role="img" aria-labelledby="t d">
  <title id="t">The SD card modes</title>
  <desc id="d">The ECU's SD thread keeps the card in one mode at a time: ECU (logging), PC (a USB drive on
  the computer), UNMOUNT, or FORMAT, and every change passes through IDLE. A request from TunerStudio
  wins; otherwise the mode follows USB and ignition voltage.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; }
    .wire-ask-dash { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    .arrow-ask { fill: #2563eb; }
    .arrow-drive { fill: #e8710a; }
    .arrow-safe { fill: #c8412d; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
      .arrow-ask { fill: #60a5fa; } .arrow-drive { fill: #e8710a; } .arrow-safe { fill: #c8412d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-drive"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-ask"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-safe"/>
    </marker>
  </defs>

  <!-- what decides the mode -->
  <rect class="ask" x="20" y="56" width="282" height="216" rx="6"/>
  <text x="34" y="80">What the card should be doing</text>
  <text x="34" y="106" class="small">1  a Mount to PC / Mount to ECU press,</text>
  <text x="46" y="122" class="small">kept until the ECU next powers up</text>
  <text x="34" y="148" class="small">2  no USB and no ignition → UNMOUNT</text>
  <text x="46" y="164" class="small">(a power cut is coming)</text>
  <text x="34" y="190" class="small">3  Always start in Logging mode → ECU</text>
  <text x="34" y="214" class="small">4  USB connected → PC</text>
  <text x="34" y="238" class="small">5  none of these → ECU, and log</text>

  <!-- the hub every transition passes through -->
  <rect class="loop" x="352" y="148" width="170" height="76" rx="6"/>
  <text x="437" y="176" text-anchor="middle">IDLE</text>
  <text x="437" y="196" text-anchor="middle" class="small">every change passes</text>
  <text x="437" y="212" text-anchor="middle" class="small">through here first</text>

  <!-- the four real modes -->
  <rect class="drive" x="608" y="20" width="352" height="60" rx="6"/>
  <text x="622" y="44">ECU mode — the ECU is logging</text>
  <text x="622" y="64" class="mono">re_yymmdd_HHMMSS.mlg, 32 MB a file</text>

  <rect class="drive" x="608" y="118" width="352" height="60" rx="6"/>
  <text x="622" y="142">PC mode — the card is a USB drive</text>
  <text x="622" y="162" class="small">your computer opens it; the ECU writes nothing</text>

  <rect class="box" x="608" y="216" width="352" height="60" rx="6"/>
  <text x="622" y="240">UNMOUNT — released</text>
  <text x="622" y="260" class="small">nothing is being written; safe to lose power</text>

  <rect class="safe" x="608" y="306" width="352" height="60" rx="6"/>
  <text x="622" y="330">FORMAT — wipes the card</text>
  <text x="622" y="350" class="small">then labels it</text> <text x="712" y="350" class="mono">rusEFI logs</text>

  <path class="wire-ask-dash" d="M302,186 H350" marker-end="url(#aa)"/>

  <path class="wire-drive" d="M522,168 H562 V50 H606" marker-end="url(#ad)"/>
  <path class="wire-drive" d="M522,180 H580 V148 H606" marker-end="url(#ad)"/>
  <path class="wire" d="M522,192 H572 V246 H606" marker-end="url(#a)"/>
  <path class="wire-safe" d="M522,206 H562 V336 H606" marker-end="url(#as)"/>
</svg>
