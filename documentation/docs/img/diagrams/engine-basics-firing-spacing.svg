<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">Cylinder spacing in a four-stroke cycle</title>
  <desc id="d">A four-stroke cycle is 720 degrees. With four cylinders and firing order 1-3-4-2, cylinders fire at 0, 180, 360 and 540 degrees. A cylinder offset moves one cylinder later (positive) or earlier (negative).</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
  <path class="wire" d="M60,110 H860" marker-end="url(#a)"/>
  <text x="60" y="140" text-anchor="middle" class="small">0°</text>
  <text x="250" y="140" text-anchor="middle" class="small">180°</text>
  <text x="440" y="140" text-anchor="middle" class="small">360°</text>
  <text x="630" y="140" text-anchor="middle" class="small">540°</text>
  <text x="820" y="140" text-anchor="middle" class="small">720°</text>
  <rect class="ask" x="30" y="50" width="60" height="40" rx="6"/><text x="60" y="76" text-anchor="middle">cyl 1</text>
  <rect class="ask" x="220" y="50" width="60" height="40" rx="6"/><text x="250" y="76" text-anchor="middle">cyl 3</text>
  <rect class="ask" x="410" y="50" width="60" height="40" rx="6"/><text x="440" y="76" text-anchor="middle">cyl 4</text>
  <rect class="ask" x="600" y="50" width="60" height="40" rx="6"/><text x="630" y="76" text-anchor="middle">cyl 2</text>
  <path class="wire" d="M60,90 V110 M250,90 V110 M440,90 V110 M630,90 V110"/>
  <text x="440" y="30" text-anchor="middle">base position = 720° × (place in firing order) ÷ cylinders</text>
  <rect class="drive" x="250" y="160" width="400" height="50" rx="6"/>
  <text x="450" y="182" text-anchor="middle">+ Offset cyl N (Advanced ▸ Cylinder offsets)</text>
  <text x="450" y="200" text-anchor="middle" class="small">positive = later (retard), negative = earlier (advance)</text>
</svg>
