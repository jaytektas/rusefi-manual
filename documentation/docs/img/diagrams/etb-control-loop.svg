<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Electronic throttle control loop</title>
  <desc id="d">The pedal position goes through the ETB pedal target table, then the idle position adder,
  adjustments and limits, to become the throttle target. Feed-forward from the bias curve plus a PID on
  the position error gives a duty cycle, which drives the H-bridge and motor. Two TPS tracks measure
  the throttle; if they agree, their average closes the loop. Status checks can disable the motor.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- row 1: building the target (blue = what is asked for) -->
  <rect class="ask" x="20" y="30" width="120" height="56" rx="6"/>
  <text x="80" y="54" text-anchor="middle">Pedal</text>
  <text x="80" y="72" text-anchor="middle" class="small">0–100 %</text>

  <rect class="ask" x="170" y="30" width="150" height="56" rx="6"/>
  <text x="245" y="54" text-anchor="middle">ETB pedal target</text>
  <text x="245" y="72" text-anchor="middle" class="small">table: pedal × RPM</text>

  <rect class="ask" x="350" y="30" width="160" height="56" rx="6"/>
  <text x="430" y="54" text-anchor="middle">+ idle position</text>
  <text x="430" y="72" text-anchor="middle" class="small">from the idle controller</text>

  <rect class="ask" x="540" y="30" width="170" height="56" rx="6"/>
  <text x="625" y="54" text-anchor="middle">+ adjustments</text>
  <text x="625" y="72" text-anchor="middle" class="small">Lua, traction, ETB 2 trim</text>

  <rect class="ask" x="740" y="30" width="200" height="56" rx="6"/>
  <text x="840" y="54" text-anchor="middle">limits</text>
  <text x="840" y="72" text-anchor="middle" class="small">RPM taper, min / max position</text>

  <path class="wire-ask" d="M140,58 H168" marker-end="url(#a)"/>
  <path class="wire-ask" d="M320,58 H348" marker-end="url(#a)"/>
  <path class="wire-ask" d="M510,58 H538" marker-end="url(#a)"/>
  <path class="wire-ask" d="M710,58 H738" marker-end="url(#a)"/>

  <!-- target down into the controller -->
  <path class="wire-ask" d="M840,86 V126" marker-end="url(#a)"/>
  <text x="850" y="112" class="small">throttle target</text>

  <!-- row 2: controller (green = closed loop) and output (orange = what is driven) -->
  <rect class="loop" x="700" y="128" width="240" height="70" rx="6"/>
  <text x="820" y="152" text-anchor="middle">feed-forward + PID</text>
  <text x="820" y="170" text-anchor="middle" class="small">bias curve (target) + PID (error)</text>
  <text x="820" y="187" text-anchor="middle" class="mono">etbBias* · etb_p/i/dFactor</text>

  <rect class="drive" x="430" y="138" width="210" height="50" rx="6"/>
  <text x="535" y="160" text-anchor="middle">duty cycle</text>
  <text x="535" y="177" text-anchor="middle" class="small">battery-compensated, max ±90 %</text>

  <rect class="drive" x="200" y="138" width="180" height="50" rx="6"/>
  <text x="290" y="160" text-anchor="middle">H-bridge + motor</text>
  <text x="290" y="177" text-anchor="middle" class="small">PWM at etbFreq</text>

  <rect class="box" x="20" y="138" width="168" height="50" rx="6"/>
  <text x="104" y="160" text-anchor="middle">throttle plate</text>
  <text x="104" y="177" text-anchor="middle" class="small">spring rest: slightly open</text>

  <path class="wire-drive" d="M700,163 H642" marker-end="url(#a)"/>
  <path class="wire-drive" d="M430,163 H382" marker-end="url(#a)"/>
  <path class="wire-drive" d="M200,163 H190" marker-end="url(#a)"/>

  <!-- row 3: measurement back to the controller -->
  <rect class="loop" x="20" y="250" width="200" height="56" rx="6"/>
  <text x="120" y="274" text-anchor="middle">TPS track 1 + track 2</text>
  <text x="120" y="292" text-anchor="middle" class="small">two sensors, opposite slopes</text>

  <rect class="loop" x="260" y="250" width="260" height="56" rx="6"/>
  <text x="390" y="274" text-anchor="middle">redundancy check</text>
  <text x="390" y="292" text-anchor="middle" class="small">agree within etbSplit → average</text>

  <path class="wire-loop" d="M85,188 V248" marker-end="url(#a)"/>
  <path class="wire-loop" d="M220,278 H258" marker-end="url(#a)"/>
  <path class="wire-loop" d="M520,278 H820 V200" marker-end="url(#a)"/>
  <text x="560" y="270" class="small">measured position (TPS %)</text>

  <!-- safety (red) -->
  <rect class="safe" x="560" y="330" width="380" height="70" rx="6"/>
  <text x="750" y="354" text-anchor="middle">status checks (every loop, 500 Hz)</text>
  <text x="750" y="372" text-anchor="middle" class="small">TPS / pedal noise, redundancy, jam, Lua, engine stopped</text>
  <text x="750" y="389" text-anchor="middle" class="small">any failure → motor disabled → plate returns to spring rest</text>
  <path class="wire-safe" d="M560,365 H290 V190" marker-end="url(#a)"/>
  <path class="wire-safe" d="M390,306 V330 H560" />
</svg>
