<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">Idle valve drive paths</title>
  <desc id="d">The idle controller always produces one number, idle position 0 to 100 percent. applyIACposition feeds it three ways: to the electronic throttle controller scaled by the ETB idle range, to a stepper motor as a step count, or to one or two PWM solenoid outputs. On Proteus the stepper is driven by the two ETB H-bridges, and the solenoid by a flyback lowside output.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="ask" x="20" y="150" width="230" height="90" rx="6"/>
  <text x="135" y="176" text-anchor="middle">Idle position</text>
  <text x="135" y="196" text-anchor="middle" class="small">one number, 0–100 %</text>
  <text x="135" y="214" text-anchor="middle" class="mono">currentIdlePosition</text>
  <text x="135" y="230" text-anchor="middle" class="small">every 5 ms (200 Hz)</text>

  <rect class="drive" x="310" y="20" width="270" height="76" rx="6"/>
  <text x="445" y="44" text-anchor="middle">Electronic throttle</text>
  <text x="445" y="64" text-anchor="middle" class="small">idle range × position = base TPS</text>
  <text x="445" y="82" text-anchor="middle" class="mono">etbIdleThrottleRange 15 %</text>
  <rect class="drive" x="650" y="20" width="290" height="76" rx="6"/>
  <text x="795" y="44" text-anchor="middle">The ETB motor, already wired</text>
  <text x="795" y="64" text-anchor="middle" class="small">Black 7 (+) and Black 6 (−)</text>
  <text x="795" y="82" text-anchor="middle" class="mono">H-Bridge #1 function: Throttle 1</text>

  <rect class="drive" x="310" y="150" width="270" height="76" rx="6"/>
  <text x="445" y="174" text-anchor="middle">Stepper idle valve</text>
  <text x="445" y="194" text-anchor="middle" class="small">position × total steps = step target</text>
  <text x="445" y="212" text-anchor="middle" class="mono">idleStepperTotalSteps 200</text>
  <rect class="drive" x="650" y="150" width="290" height="76" rx="6"/>
  <text x="795" y="174" text-anchor="middle">Two H-bridges (Proteus)</text>
  <text x="795" y="194" text-anchor="middle" class="small">Idle ▸ Idle hardware ▸ Drive stepper with</text>
  <text x="795" y="212" text-anchor="middle" class="mono">dual H bridges · stepperDcIo</text>

  <rect class="drive" x="310" y="280" width="270" height="76" rx="6"/>
  <text x="445" y="304" text-anchor="middle">PWM solenoid valve</text>
  <text x="445" y="324" text-anchor="middle" class="small">duty = position, default 300 Hz</text>
  <text x="445" y="342" text-anchor="middle" class="mono">idle.solenoidFrequency</text>
  <rect class="drive" x="650" y="280" width="290" height="76" rx="6"/>
  <text x="795" y="304" text-anchor="middle">One flyback output</text>
  <text x="795" y="324" text-anchor="middle" class="small">Idle Solenoid Primary output,</text>
  <text x="795" y="342" text-anchor="middle" class="mono">e.g. Lowside 15 · secondSolenoidPin</text>

  <path class="wire-drive" d="M250,175 H280 V58 H308" marker-end="url(#a)"/>
  <path class="wire-drive" d="M580,58 H648" marker-end="url(#a)"/>
  <path class="wire-ask" d="M250,195 H308" marker-end="url(#a)"/>
  <path class="wire-drive" d="M580,188 H648" marker-end="url(#a)"/>
  <path class="wire-ask" d="M250,215 H280 V318 H308" marker-end="url(#a)"/>
  <path class="wire-drive" d="M580,318 H648" marker-end="url(#a)"/>

  <text x="310" y="246" class="small">Step/dir driver option: Idle Stepper Step / Dir / Enable pins are raw MCU pins, not connector names.</text>
  <text x="310" y="266" class="small">Push-pull coil option exists in the firmware but this board's TunerStudio ini does not show it.</text>
</svg>
