<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Where the software comes from and what talks to the ECU</title>
  <desc id="d">TunerStudio MS and MegaLogViewer HD are downloaded from the EFI Analytics website and
  installed on your computer. The rusEFI bundle for your board is downloaded once from the rusEFI
  build server and unzipped into a folder; it holds the rusEFI console, the firmware, the TunerStudio
  .ini file, drivers and scripts. Each time the console starts it asks the build server for a newer
  bundle and updates itself. TunerStudio talks to the ECU over USB to set up and tune the engine;
  the console talks to it over USB to update the firmware. MegaLogViewer opens the logs TunerStudio
  records.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .title { font-weight: bold; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 4 4; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
      .frame { stroke: #6b7280; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- internet sources -->
  <rect class="ask" x="10" y="50" width="190" height="70" rx="6"/>
  <text x="105" y="78" text-anchor="middle" class="title">EFI Analytics website</text>
  <text x="105" y="98" text-anchor="middle" class="small">TunerStudio, MegaLogViewer</text>

  <rect class="ask" x="10" y="260" width="190" height="80" rx="6"/>
  <text x="105" y="288" text-anchor="middle" class="title">rusEFI build server</text>
  <text x="105" y="306" text-anchor="middle" class="mono">rusefi.com/build_server</text>
  <text x="105" y="324" text-anchor="middle" class="small">one bundle per board</text>

  <!-- the computer -->
  <rect class="frame" x="300" y="20" width="410" height="380" rx="10"/>
  <text x="500" y="44" text-anchor="middle" class="small">your computer</text>

  <rect class="box" x="322" y="60" width="356" height="54" rx="6"/>
  <text x="500" y="83" text-anchor="middle" class="title">TunerStudio MS</text>
  <text x="500" y="101" text-anchor="middle" class="small">set up and tune the engine, record logs</text>

  <rect class="box" x="322" y="150" width="356" height="54" rx="6"/>
  <text x="500" y="173" text-anchor="middle" class="title">MegaLogViewer HD</text>
  <text x="500" y="191" text-anchor="middle" class="small">view and analyse logs</text>

  <path class="wire" d="M500,114 V148" marker-end="url(#a)"/>
  <text x="510" y="136" class="small">logs</text>

  <rect class="box" x="322" y="230" width="356" height="150" rx="6"/>
  <text x="500" y="252" text-anchor="middle" class="title">rusEFI bundle folder</text>
  <rect class="loop" x="340" y="264" width="320" height="44" rx="6"/>
  <text x="500" y="285" text-anchor="middle">rusEFI console</text>
  <text x="500" y="300" text-anchor="middle" class="small">firmware update, recovery, diagnostics</text>
  <text x="500" y="332" text-anchor="middle" class="small">firmware (.bin, .srec) · TunerStudio .ini</text>
  <text x="500" y="350" text-anchor="middle" class="small">Windows drivers · scripts (bin/)</text>
  <text x="500" y="368" text-anchor="middle" class="mono">console/release.txt names the board</text>

  <!-- downloads (blue) -->
  <path class="wire-ask" d="M200,80 H320" marker-end="url(#a)"/>
  <path class="wire-ask" d="M200,100 H250 V177 H320" marker-end="url(#a)"/>
  <text x="206" y="72" class="small">install</text>

  <path class="wire-ask" d="M200,330 H320" marker-end="url(#a)"/>
  <text x="206" y="350" class="small">download once,</text>
  <text x="206" y="364" class="small">then unzip</text>

  <!-- auto-update loop (green) -->
  <path class="wire-loop" d="M338,286 H202" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="206" y="264" class="small">at every start:</text>
  <text x="206" y="278" class="small">newer bundle?</text>

  <!-- ECU -->
  <rect class="drive" x="780" y="170" width="160" height="90" rx="6"/>
  <text x="860" y="205" text-anchor="middle" class="title">ECU</text>
  <text x="860" y="224" text-anchor="middle" class="small">e.g. Proteus F7</text>
  <text x="860" y="242" text-anchor="middle" class="small">USB</text>

  <path class="wire-drive" d="M680,87 H740 V195 H778" marker-end="url(#a)"/>
  <text x="690" y="78" class="small">tune</text>
  <path class="wire-drive" d="M660,286 H740 V235 H778" marker-end="url(#a)"/>
  <text x="716" y="302" class="small">firmware</text>
</svg>
