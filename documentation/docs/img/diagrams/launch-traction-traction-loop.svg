<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 376" role="img" aria-labelledby="t d">
  <title id="t">Traction control: wheel slip from CAN, three tables, three levers, closed by the engine</title>
  <desc id="d">CAN wheel speeds give a front-to-rear axle slip ratio. That slip ratio and vehicle speed look up
  three six-by-six tables: an ETB throttle drop, a timing drop and an ignition skip percent. Their outputs
  reduce engine torque, which reduces slip - the loop closes through the engine itself. rusEFI never applies
  the brakes. Without CAN wheel speeds the slip ratio reads zero, below the lowest slip bin, so the lowest row
  of every table applies whenever it holds a value.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    .arrow-drive { fill: #e8710a; }
    .arrow-loop { fill: #2e9d4f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
      .arrow-drive { fill: #e8710a; } .arrow-loop { fill: #2e9d4f; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-drive"/>
    </marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-loop"/>
    </marker>
  </defs>

  <rect class="loop" x="20" y="40" width="190" height="80" rx="6"/>
  <text x="30" y="62">CAN wheel speeds</text>
  <text x="30" y="80" class="small">front and rear axle speed</text>
  <text x="30" y="98" class="mono">canVssNbcType</text>

  <rect class="loop" x="250" y="40" width="180" height="80" rx="6"/>
  <text x="260" y="62">Slip ratio</text>
  <text x="260" y="80" class="small">front axle / rear axle</text>
  <text x="260" y="98" class="mono">wheelSlipRatio</text>
  <path class="wire-loop" d="M210,80 L250,80" marker-end="url(#al)"/>

  <rect class="box" x="470" y="40" width="180" height="80" rx="6"/>
  <text x="480" y="62">Three tables</text>
  <text x="480" y="80" class="small">6 x 6, slip ratio against</text>
  <text x="480" y="96" class="small">vehicle speed</text>
  <path class="wire" d="M430,80 L470,80" marker-end="url(#a)"/>

  <rect class="drive" x="690" y="30" width="270" height="54" rx="6"/>
  <text x="700" y="52">Throttle target minus percent</text>
  <text x="700" y="70" class="small">Traction Control ETB Drop</text>
  <rect class="drive" x="690" y="98" width="270" height="54" rx="6"/>
  <text x="700" y="120">Timing in degrees</text>
  <text x="700" y="138" class="small">Traction Control Timing Adjustment</text>
  <rect class="drive" x="690" y="166" width="270" height="54" rx="6"/>
  <text x="700" y="188">Ignition events skipped, percent</text>
  <text x="700" y="206" class="small">Traction Control Skip Ignition</text>
  <path class="wire-drive" d="M650,66 L668,66 L668,57 L690,57" marker-end="url(#ad)"/>
  <path class="wire-drive" d="M650,80 L668,80 L668,125 L690,125" marker-end="url(#ad)"/>
  <path class="wire-drive" d="M650,94 L668,94 L668,193 L690,193" marker-end="url(#ad)"/>

  <path class="wire-loop" d="M825,220 L825,250 L340,250 L340,120" marker-end="url(#al)"/>
  <text x="580" y="244" text-anchor="middle" class="small">less torque, less slip - the loop closes through the engine</text>

  <rect class="safe" x="20" y="284" width="940" height="72" rx="6"/>
  <text x="30" y="306">Without CAN wheel speeds the slip ratio reads zero</text>
  <text x="30" y="324" class="small">Zero is below the lowest slip bin, so the lookup uses the lowest row of all three tables - forever, at any</text>
  <text x="30" y="340" class="small">speed, whether or not the wheels are spinning. Fill that row only if you mean it always.</text>
</svg>
