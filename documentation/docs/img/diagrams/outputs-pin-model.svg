<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How an output reaches a connector pin</title>
  <desc id="d">A firmware function such as the cooling fan reads its pin setting, fanPin, whose value is a connector name such as Lowside 11; the board maps that name to Black 35 pin 9, which switches the fan relay coil to ground.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>
  <rect class="ask" x="20" y="40" width="190" height="70" rx="6"/>
  <text x="115" y="68" text-anchor="middle">Function</text>
  <text x="115" y="88" text-anchor="middle" class="small">cooling fan 1 logic</text>
  <rect class="box" x="250" y="40" width="190" height="70" rx="6"/>
  <text x="345" y="68" text-anchor="middle">Setting</text>
  <text x="345" y="88" text-anchor="middle" class="mono">fanPin = "Lowside 11"</text>
  <rect class="box" x="480" y="40" width="190" height="70" rx="6"/>
  <text x="575" y="68" text-anchor="middle">Board pin</text>
  <text x="575" y="88" text-anchor="middle" class="small">Black 35, pin 9</text>
  <rect class="drive" x="710" y="40" width="170" height="70" rx="6"/>
  <text x="795" y="68" text-anchor="middle">Load</text>
  <text x="795" y="88" text-anchor="middle" class="small">fan relay coil</text>
  <path class="wire-ask" d="M210,75 H248" marker-end="url(#a)"/>
  <path class="wire" d="M440,75 H478" marker-end="url(#a)"/>
  <path class="wire-drive" d="M670,75 H708" marker-end="url(#a)"/>
  <rect class="safe" x="250" y="170" width="420" height="90" rx="6"/>
  <text x="460" y="196" text-anchor="middle">pin repository (at start-up and on every burn)</text>
  <text x="460" y="218" text-anchor="middle" class="small">each MCU pin may have one owner</text>
  <text x="460" y="238" text-anchor="middle" class="small">second owner → fatal error, all outputs off</text>
  <path class="wire-safe" d="M575,110 V168" marker-end="url(#a)"/>
  <text x="590" y="145" class="small">claims the pin</text>
</svg>
