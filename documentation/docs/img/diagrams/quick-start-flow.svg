<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Quick start: the fifteen steps from box to first start</title>
  <desc id="d">Fifteen steps in order: wiring, power and grounds, flash firmware, first connection, engine basics,
  trigger, sensors, outputs, fuel basics, ignition basics, idle and throttle, bench test, first crank, first start,
  logging. Steps 5 to 11 are settings, steps 12 and 13 drive outputs, steps 14 and 15 are running and logging.
  If cranking shows no RPM or no sync, go back to the trigger step.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <text x="16" y="40">Prepare: hardware, firmware, connection</text>
  <text x="16" y="56" class="small">Calibrate and test only with the ECU on 12 V (ignition on), never on USB power alone</text>
  <text x="116" y="190">Configure: engine stopped, ignition on</text>
  <text x="116" y="320">Finish setup, test, start, record</text>
  <rect class="box" x="16" y="70" width="168" height="64" rx="6"/>
  <text x="100" y="96" text-anchor="middle">1 · Wiring</text>
  <text x="100" y="116" text-anchor="middle" class="small">Part II</text>
  <path class="wire" d="M184,102 H204" marker-end="url(#a)"/>
  <rect class="box" x="206" y="70" width="168" height="64" rx="6"/>
  <text x="290" y="96" text-anchor="middle">2 · Power and grounds</text>
  <text x="290" y="116" text-anchor="middle" class="small">12 V, fuses, relays</text>
  <path class="wire" d="M374,102 H394" marker-end="url(#a)"/>
  <rect class="box" x="396" y="70" width="168" height="64" rx="6"/>
  <text x="480" y="96" text-anchor="middle">3 · Flash firmware</text>
  <text x="480" y="116" text-anchor="middle" class="small">rusEFI console</text>
  <path class="wire" d="M564,102 H584" marker-end="url(#a)"/>
  <rect class="box" x="586" y="70" width="168" height="64" rx="6"/>
  <text x="670" y="96" text-anchor="middle">4 · First connection</text>
  <text x="670" y="116" text-anchor="middle" class="small">TunerStudio project</text>
  <path class="wire" d="M754,102 H774" marker-end="url(#a)"/>
  <rect class="ask" x="776" y="70" width="168" height="64" rx="6"/>
  <text x="860" y="96" text-anchor="middle">5 · Engine basics</text>
  <text x="860" y="116" text-anchor="middle" class="small">Vehicle Information</text>
  <rect class="ask" x="16" y="200" width="168" height="64" rx="6"/>
  <text x="100" y="226" text-anchor="middle">6 · Trigger</text>
  <text x="100" y="246" text-anchor="middle" class="small">Setup ▸ Trigger</text>
  <path class="wire" d="M184,232 H204" marker-end="url(#a)"/>
  <rect class="ask" x="206" y="200" width="168" height="64" rx="6"/>
  <text x="290" y="226" text-anchor="middle">7 · Sensors</text>
  <text x="290" y="246" text-anchor="middle" class="small">Sensors menu</text>
  <path class="wire" d="M374,232 H394" marker-end="url(#a)"/>
  <rect class="ask" x="396" y="200" width="168" height="64" rx="6"/>
  <text x="480" y="226" text-anchor="middle">8 · Outputs</text>
  <text x="480" y="246" text-anchor="middle" class="small">Injection / Ignition hw</text>
  <path class="wire" d="M564,232 H584" marker-end="url(#a)"/>
  <rect class="ask" x="586" y="200" width="168" height="64" rx="6"/>
  <text x="670" y="226" text-anchor="middle">9 · Fuel basics</text>
  <text x="670" y="246" text-anchor="middle" class="small">Injection configuration</text>
  <path class="wire" d="M754,232 H774" marker-end="url(#a)"/>
  <rect class="ask" x="776" y="200" width="168" height="64" rx="6"/>
  <text x="860" y="226" text-anchor="middle">10 · Ignition basics</text>
  <text x="860" y="246" text-anchor="middle" class="small">advance, dwell, timing</text>
  <rect class="ask" x="16" y="330" width="168" height="64" rx="6"/>
  <text x="100" y="356" text-anchor="middle">11 · Idle / throttle</text>
  <text x="100" y="376" text-anchor="middle" class="small">Idle, ETB</text>
  <path class="wire" d="M184,362 H204" marker-end="url(#a)"/>
  <rect class="drive" x="206" y="330" width="168" height="64" rx="6"/>
  <text x="290" y="356" text-anchor="middle">12 · Bench test</text>
  <text x="290" y="376" text-anchor="middle" class="small">Controller ▸ Bench test</text>
  <path class="wire" d="M374,362 H394" marker-end="url(#a)"/>
  <rect class="drive" x="396" y="330" width="168" height="64" rx="6"/>
  <text x="480" y="356" text-anchor="middle">13 · First crank</text>
  <text x="480" y="376" text-anchor="middle" class="small">Cranking settings</text>
  <path class="wire" d="M564,362 H584" marker-end="url(#a)"/>
  <rect class="loop" x="586" y="330" width="168" height="64" rx="6"/>
  <text x="670" y="356" text-anchor="middle">14 · First start</text>
  <text x="670" y="376" text-anchor="middle" class="small">check timing, warm up</text>
  <path class="wire" d="M754,362 H774" marker-end="url(#a)"/>
  <rect class="loop" x="776" y="330" width="168" height="64" rx="6"/>
  <text x="860" y="356" text-anchor="middle">15 · Logging</text>
  <text x="860" y="376" text-anchor="middle" class="small">Data Logging, SD card</text>
  <path class="wire" d="M860,134 V150 H100 V198" marker-end="url(#a)"/>
  <path class="wire" d="M860,264 V280 H100 V328" marker-end="url(#a)"/>
  <path class="wire-safe" d="M480,394 V424 H6 V232 H14" marker-end="url(#a)"/>
  <text x="490" y="418" class="small">no RPM or no sync while cranking: back to step 6</text>

  <!-- legend -->
  <rect class="ask" x="16" y="446" width="18" height="14" rx="3"/>
  <text x="40" y="458" class="small">settings in TunerStudio</text>
  <rect class="drive" x="200" y="446" width="18" height="14" rx="3"/>
  <text x="224" y="458" class="small">the ECU drives outputs or the engine turns</text>
  <rect class="loop" x="480" y="446" width="18" height="14" rx="3"/>
  <text x="504" y="458" class="small">engine running: watch, log, adjust</text>
  <path class="wire-safe" d="M730,453 H770"/>
  <text x="778" y="458" class="small">stop and go back</text>
</svg>
