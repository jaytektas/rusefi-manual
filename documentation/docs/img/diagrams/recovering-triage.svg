<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Which recovery procedure an ECU needs, from what you can see</title>
  <desc id="d">Start from what the tools report. If TunerStudio connects and shows settings, the
  firmware is fine and the settings are the problem: Procedure A, then Procedure B. If the rusEFI
  console lists the port as OpenBLT Bootloader, the firmware is invalid or missing but OpenBLT works:
  Procedure C. If the console sees a STM32 BOOTLOADER device or nothing at all, OpenBLT is damaged too:
  Procedure D, then Procedure E. Evidence you can collect in any state: board LEDs, the console
  start-up log, the fail reports on the SD card. In every case the tune lives above the firmware area,
  and an engine must never be started on factory defaults.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- starting point -->
  <rect class="box" x="330" y="20" width="300" height="54" rx="6"/>
  <text x="480" y="42" text-anchor="middle">The ECU is not behaving</text>
  <text x="480" y="61" text-anchor="middle" class="small">what do the tools see?</text>

  <!-- three questions -->
  <rect class="ask" x="20" y="120" width="290" height="72" rx="6"/>
  <text x="165" y="142" text-anchor="middle">TunerStudio connects</text>
  <text x="165" y="161" text-anchor="middle">and shows a tune?</text>
  <text x="165" y="180" text-anchor="middle" class="small">firmware is running</text>

  <rect class="ask" x="335" y="120" width="290" height="72" rx="6"/>
  <text x="480" y="142" text-anchor="middle">Console port reads</text>
  <text x="480" y="161" text-anchor="middle" class="mono">OpenBLT Bootloader</text>
  <text x="480" y="180" text-anchor="middle" class="small">all four LEDs blink together</text>

  <rect class="ask" x="650" y="120" width="290" height="72" rx="6"/>
  <text x="795" y="142" text-anchor="middle">STM32 BOOTLOADER device,</text>
  <text x="795" y="161" text-anchor="middle">or nothing at all?</text>
  <text x="795" y="180" text-anchor="middle" class="small">no serial port, no OpenBLT</text>

  <path class="wire" d="M400,74 V97 H165 V118" marker-end="url(#a)"/>
  <path class="wire" d="M480,74 V118" marker-end="url(#a)"/>
  <path class="wire" d="M560,74 V97 H795 V118" marker-end="url(#a)"/>

  <!-- three outcomes -->
  <rect class="loop" x="20" y="240" width="290" height="80" rx="6"/>
  <text x="165" y="264" text-anchor="middle">Firmware alive:</text>
  <text x="165" y="283" text-anchor="middle">the settings are the fault</text>
  <text x="165" y="305" text-anchor="middle" class="small">Procedure A, then Procedure B</text>

  <rect class="drive" x="335" y="240" width="290" height="80" rx="6"/>
  <text x="480" y="264" text-anchor="middle">Firmware invalid or absent,</text>
  <text x="480" y="283" text-anchor="middle">OpenBLT intact</text>
  <text x="480" y="305" text-anchor="middle" class="small">Procedure C</text>

  <rect class="safe" x="650" y="240" width="290" height="80" rx="6"/>
  <text x="795" y="264" text-anchor="middle">OpenBLT damaged as well,</text>
  <text x="795" y="283" text-anchor="middle">or the chip is blank</text>
  <text x="795" y="305" text-anchor="middle" class="small">Procedure D, then Procedure E</text>

  <path class="wire-loop" d="M165,192 V238" marker-end="url(#a)"/>
  <path class="wire-drive" d="M480,192 V238" marker-end="url(#a)"/>
  <path class="wire-safe" d="M795,192 V238" marker-end="url(#a)"/>

  <!-- evidence strip -->
  <rect class="box" x="20" y="360" width="920" height="62" rx="6"/>
  <text x="40" y="384">Evidence worth collecting in any state</text>
  <text x="40" y="403" class="small">the board's LEDs · the console's start-up log (Reset Cause, WD resets, SW resets, last error) ·</text>
  <text x="40" y="418" class="small">the *_fail_*.txt reports on the SD card · show_blt_version</text>

  <path class="wire" d="M165,320 V358" marker-end="url(#a)"/>
  <path class="wire" d="M480,320 V358" marker-end="url(#a)"/>
  <path class="wire" d="M795,320 V358" marker-end="url(#a)"/>

  <!-- the rule that applies to all three -->
  <rect class="safe" x="20" y="444" width="920" height="56" rx="6"/>
  <text x="480" y="466" text-anchor="middle">In every case: your tune sits above the firmware area and usually survives</text>
  <text x="480" y="485" text-anchor="middle" class="small">never run an engine on factory defaults · save the tune first when the ECU still answers</text>
</svg>
