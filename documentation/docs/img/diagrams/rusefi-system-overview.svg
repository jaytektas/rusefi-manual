<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">The rusEFI system at a glance</title>
  <desc id="d">On the PC: TunerStudio and the rusEFI console both talk to the ECU firmware over USB, one at a
  time. The console also loads new firmware: the update .srec through the OpenBLT bootloader, or the full
  .bin through the chip's DFU mode. The simulator runs rusEFI on the PC and is reached over TCP. The ECU
  writes .mlg datalogs to its SD card, which appears on the PC as a USB drive; MegaLogViewer opens .mlg
  files. The bundle folder holds the firmware files, the TunerStudio .ini, the console, drivers and scripts.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .head { font-size: 14px; font-weight: bold; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .group { fill: none; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 6 4; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
      .group { stroke: #6b7280; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- ===== PC side ===== -->
  <rect class="group" x="20" y="30" width="440" height="480" rx="10"/>
  <text x="36" y="52" class="head">Your PC</text>

  <rect class="ask" x="40" y="70" width="190" height="72" rx="6"/>
  <text x="135" y="94" text-anchor="middle">MegaLogViewer</text>
  <text x="135" y="112" text-anchor="middle" class="small">views datalogs</text>
  <text x="135" y="130" text-anchor="middle" class="mono">.mlg</text>

  <rect class="ask" x="250" y="70" width="190" height="72" rx="6"/>
  <text x="345" y="94" text-anchor="middle">TunerStudio</text>
  <text x="345" y="112" text-anchor="middle" class="small">set up and tune the engine</text>
  <text x="345" y="130" text-anchor="middle" class="mono">project: .ini + .msq</text>

  <rect class="ask" x="40" y="172" width="176" height="72" rx="6"/>
  <text x="128" y="196" text-anchor="middle">Simulator</text>
  <text x="128" y="214" text-anchor="middle" class="small">rusEFI without hardware</text>
  <text x="128" y="232" text-anchor="middle" class="mono">TCP port 29001</text>

  <rect class="ask" x="250" y="172" width="190" height="72" rx="6"/>
  <text x="345" y="196" text-anchor="middle">rusEFI console</text>
  <text x="345" y="214" text-anchor="middle" class="small">look after the ECU</text>
  <text x="345" y="232" text-anchor="middle" class="mono">rusefi_console.jar</text>

  <!-- TS writes datalogs that MegaLogViewer opens -->
  <path class="wire" d="M250,106 H232" marker-end="url(#a)"/>
  <!-- simulator links -->
  <path class="wire" d="M216,208 H248" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="wire" d="M190,172 L262,144" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- bundle folder -->
  <rect class="box" x="40" y="276" width="400" height="216" rx="6"/>
  <text x="56" y="298" class="head">Bundle folder</text>
  <text x="56" y="316" class="small">unzipped from rusefi_bundle_&lt;board&gt;.zip</text>
  <text x="56" y="342" class="mono">rusefi_…_update.srec</text>
  <text x="228" y="342" class="small">firmware only, for OpenBLT</text>
  <text x="56" y="362" class="mono">rusefi_….bin</text>
  <text x="228" y="362" class="small">OpenBLT + firmware, for DFU</text>
  <text x="56" y="382" class="mono">rusefi_proteus_f7.ini</text>
  <text x="228" y="382" class="small">TunerStudio definition</text>
  <text x="56" y="402" class="mono">rusefi_updater.exe/.sh</text>
  <text x="228" y="402" class="small">starts the console</text>
  <text x="56" y="422" class="mono">console/</text>
  <text x="228" y="422" class="small">console, simulator, ST tools</text>
  <text x="56" y="442" class="mono">drivers/</text>
  <text x="228" y="442" class="small">Windows USB drivers</text>
  <text x="56" y="462" class="mono">bin/</text>
  <text x="228" y="462" class="small">command-line scripts</text>
  <text x="56" y="482" class="mono">bin/device/</text>
  <text x="228" y="482" class="small">OpenBLT bootloader image</text>

  <!-- ===== ECU side ===== -->
  <rect class="group" x="580" y="30" width="360" height="480" rx="10"/>
  <text x="596" y="52" class="head">ECU (for example Proteus F7)</text>

  <rect class="drive" x="600" y="70" width="320" height="82" rx="6"/>
  <text x="760" y="92" text-anchor="middle">rusEFI firmware</text>
  <text x="760" y="110" text-anchor="middle" class="small">runs the engine; answers TunerStudio and the console</text>
  <text x="760" y="128" text-anchor="middle" class="mono">signature: rusEFI &lt;branch&gt;.&lt;date&gt;.</text>
  <text x="760" y="143" text-anchor="middle" class="mono">proteus_f7.&lt;hash&gt;</text>

  <rect class="drive" x="600" y="180" width="320" height="60" rx="6"/>
  <text x="760" y="204" text-anchor="middle">OpenBLT bootloader</text>
  <text x="760" y="222" text-anchor="middle" class="small">start of flash; loads the update .srec</text>

  <rect class="drive" x="600" y="268" width="320" height="60" rx="6"/>
  <text x="760" y="292" text-anchor="middle">STM32 DFU mode</text>
  <text x="760" y="310" text-anchor="middle" class="small">built into the chip; loads the full .bin</text>

  <rect class="drive" x="600" y="356" width="320" height="60" rx="6"/>
  <text x="760" y="380" text-anchor="middle">SD card</text>
  <text x="760" y="398" text-anchor="middle" class="small">the ECU writes .mlg datalogs</text>

  <text x="600" y="446" class="small">CAN: the console can also reach the ECU through a</text>
  <text x="600" y="462" class="small">PCAN or SocketCAN adapter, and OpenBLT can load</text>
  <text x="600" y="478" class="small">firmware over CAN.</text>

  <!-- ===== links ===== -->
  <text x="520" y="66" text-anchor="middle" class="small">USB: one program</text>
  <text x="520" y="80" text-anchor="middle" class="small">at a time</text>
  <!-- TunerStudio <-> firmware -->
  <path class="wire-ask" d="M440,104 H598" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- console <-> firmware -->
  <path class="wire-ask" d="M440,186 H500 V136 H598" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- console -> OpenBLT -->
  <path class="wire-drive" d="M440,210 H598" marker-end="url(#a)"/>
  <text x="560" y="204" text-anchor="middle" class="mono">.srec</text>
  <!-- console -> DFU -->
  <path class="wire-drive" d="M440,232 H500 V298 H598" marker-end="url(#a)"/>
  <text x="550" y="292" text-anchor="middle" class="mono">.bin</text>
  <!-- SD card -> PC -->
  <path class="wire" d="M600,386 H462" marker-end="url(#a)"/>
  <text x="520" y="376" text-anchor="middle" class="small">USB drive</text>
  <text x="520" y="404" text-anchor="middle" class="mono">.mlg</text>

  <!-- legend -->
  <rect class="ask" x="20" y="526" width="16" height="16" rx="3"/>
  <text x="42" y="539" class="small">programs on the PC</text>
  <rect class="drive" x="180" y="526" width="16" height="16" rx="3"/>
  <text x="202" y="539" class="small">what runs in the ECU</text>
  <rect class="box" x="350" y="526" width="16" height="16" rx="3"/>
  <text x="372" y="539" class="small">files</text>
  <path class="wire-ask" d="M440,534 H480"/>
  <text x="488" y="539" class="small">live connection</text>
  <path class="wire-drive" d="M600,534 H640"/>
  <text x="648" y="539" class="small">firmware being loaded</text>
</svg>
