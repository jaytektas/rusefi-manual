<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">The four ways a sensor reaches a Proteus ECU</title>
  <desc id="d">Four families of sensor feed the firmware. Ratiometric analog sensors (MAP, TPS,
  pressure sensors) take 5 V from White 9 or 10, return a voltage on an Analog Volt input such as
  White 13, and use sensor ground on White 1 to 8. Thermistors (CLT, IAT, oil temp) hang off an
  internal pull-up and sit on an Analog Temp input such as White 20, with the sensor leg to sensor
  ground on White 23. Frequency and switch sensors (vehicle speed, flex, clutch, brake) are square
  waves on a Digital input such as Black23 pin 2, or on a Variable Reluctance input. CAN sensors (wideband,
  EGT, speed from the dash) arrive as messages on Black23 pins 17 and 16. All four end in the same firmware
  chain: measure, scale, convert with a calibration curve, then check the value against its limits
  and its timeout.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- family 1: ratiometric analog -->
  <rect class="loop" x="20" y="20" width="450" height="200" rx="8"/>
  <text x="36" y="44">1 · Ratiometric analog</text>
  <text x="36" y="64" class="small">MAP · TPS · pedal · oil, fuel, A/C pressure</text>
  <text x="36" y="84" class="small">The ECU feeds it 5 V; the output is a fraction</text>
  <text x="36" y="100" class="small">of that supply, so the reading tracks the supply.</text>

  <rect class="drive" x="36" y="118" width="120" height="42" rx="6"/>
  <text x="96" y="136" text-anchor="middle" class="small">+5 V supply</text>
  <text x="96" y="152" text-anchor="middle" class="mono">White 9 / 21 / 32</text>
  <rect class="loop" x="196" y="118" width="120" height="42" rx="6"/>
  <text x="256" y="136" text-anchor="middle" class="small">signal in</text>
  <text x="256" y="152" text-anchor="middle" class="mono">White 13 · AV 1</text>
  <rect class="box" x="356" y="118" width="100" height="42" rx="6"/>
  <text x="406" y="136" text-anchor="middle" class="small">sensor gnd</text>
  <text x="406" y="152" text-anchor="middle" class="mono">White 1–8</text>

  <text x="36" y="190" class="small">Proteus analog inputs are numbered <tspan class="mono">Analog Volt 1…11</tspan></text>

  <!-- family 2: thermistor -->
  <rect class="loop" x="490" y="20" width="450" height="200" rx="8"/>
  <text x="506" y="44">2 · Thermistor</text>
  <text x="506" y="64" class="small">CLT · IAT · oil, fuel, ambient, aux temps</text>
  <text x="506" y="84" class="small">Two wires, no supply pin. The ECU's pull-up and</text>
  <text x="506" y="100" class="small">the sensor form a divider; resistance falls as it warms.</text>

  <rect class="drive" x="506" y="118" width="130" height="42" rx="6"/>
  <text x="571" y="136" text-anchor="middle" class="small">pull-up in ECU</text>
  <text x="571" y="152" text-anchor="middle" class="mono">2700 Ω (CLT, IAT)</text>
  <rect class="loop" x="676" y="118" width="130" height="42" rx="6"/>
  <text x="741" y="136" text-anchor="middle" class="small">temp input</text>
  <text x="741" y="152" text-anchor="middle" class="mono">White 20 · AT 3</text>
  <rect class="box" x="846" y="118" width="80" height="42" rx="6"/>
  <text x="886" y="136" text-anchor="middle" class="small">sensor gnd</text>
  <text x="886" y="152" text-anchor="middle" class="mono">White 23</text>

  <text x="506" y="190" class="small">Proteus thermistor inputs are <tspan class="mono">Analog Temp 1…4</tspan></text>

  <!-- family 3: frequency and switches -->
  <rect class="ask" x="20" y="240" width="450" height="160" rx="8"/>
  <text x="36" y="264">3 · Frequency and switch inputs</text>
  <text x="36" y="284" class="small">Vehicle speed · flex fuel · turbo speed · shaft speed</text>
  <text x="36" y="300" class="small">Clutch, brake, A/C and start-button switches</text>
  <path class="wire-ask" d="M36,336 h14 l8,-22 l10,44 l10,-22 h14 v-14 h14 l8,-22 l10,44 l10,-22 h14"/>
  <rect class="ask" x="164" y="312" width="182" height="42" rx="6"/>
  <text x="255" y="330" text-anchor="middle" class="small">edge counter</text>
  <text x="255" y="346" text-anchor="middle" class="mono">Black23 pin 2 · Digital 3</text>
  <text x="36" y="384" class="small">VR wheels use the shielded <tspan class="mono">VR 1</tspan>/<tspan class="mono">VR 2</tspan> inputs instead</text>

  <!-- family 4: CAN -->
  <rect class="ask" x="490" y="240" width="450" height="160" rx="8"/>
  <text x="506" y="264">4 · CAN messages</text>
  <text x="506" y="284" class="small">rusEFI / AEM wideband · CAN EGT · speed from the</text>
  <text x="506" y="300" class="small">dash or ABS module · sensors read from another ECU</text>
  <path class="wire-ask" d="M506,330 h110"/>
  <path class="wire-ask" d="M506,346 h110"/>
  <text x="520" y="324" class="mono">CAN H</text>
  <text x="520" y="362" class="mono">CAN L</text>
  <rect class="ask" x="650" y="312" width="140" height="42" rx="6"/>
  <text x="720" y="330" text-anchor="middle" class="small">CAN worker + timeout</text>
  <text x="720" y="346" text-anchor="middle" class="mono">Black23 17 / 16</text>
  <text x="506" y="384" class="small">Nothing is wired to an analog input; the value has an address</text>

  <!-- firmware chain -->
  <path class="wire-loop" d="M474,220 V440" marker-end="url(#a)"/>
  <path class="wire-loop" d="M486,220 V440" marker-end="url(#a)"/>
  <path class="wire-ask" d="M245,400 V440" marker-end="url(#a)"/>
  <path class="wire-ask" d="M715,400 V440" marker-end="url(#a)"/>

  <rect class="box" x="20" y="450" width="920" height="90" rx="8"/>
  <text x="36" y="474">Every sensor then runs the same chain in firmware</text>

  <rect class="loop" x="40" y="486" width="150" height="42" rx="6"/>
  <text x="115" y="504" text-anchor="middle" class="small">measure</text>
  <text x="115" y="520" text-anchor="middle" class="mono">ADC / edges / CAN</text>
  <path class="wire-loop" d="M190,507 H216" marker-end="url(#a)"/>
  <rect class="loop" x="216" y="486" width="150" height="42" rx="6"/>
  <text x="291" y="504" text-anchor="middle" class="small">scale to pin volts</text>
  <text x="291" y="520" text-anchor="middle" class="mono">× 1.56 · filtered</text>
  <path class="wire-loop" d="M366,507 H392" marker-end="url(#a)"/>
  <rect class="loop" x="392" y="486" width="170" height="42" rx="6"/>
  <text x="477" y="504" text-anchor="middle" class="small">convert with your</text>
  <text x="477" y="520" text-anchor="middle" class="mono">line · curve · table</text>
  <path class="wire-loop" d="M562,507 H588" marker-end="url(#a)"/>
  <rect class="safe" x="588" y="486" width="160" height="42" rx="6"/>
  <text x="668" y="504" text-anchor="middle" class="small">reject: limits, and</text>
  <text x="668" y="520" text-anchor="middle" class="mono">timeout</text>
  <path class="wire" d="M748,507 H774" marker-end="url(#a)"/>
  <rect class="ask" x="774" y="486" width="150" height="42" rx="6"/>
  <text x="849" y="504" text-anchor="middle" class="small">fuel, spark, boost,</text>
  <text x="849" y="520" text-anchor="middle" class="small">gauges, logging</text>
</svg>
