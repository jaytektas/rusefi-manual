<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="t d">
  <title id="t">Ratiometric sensor between 5 V and sensor ground</title>
  <desc id="d">A three-wire sensor such as a MAP sensor takes the ECU's 5 V sensor supply from White 9 and
  sensor ground from White 1 to 8, and returns a signal on White 13 (Analog Volt 1). The signal is a fraction
  of the supply. In the ECU the input divider and ADC measure it, the firmware multiplies by 1.56 and
  converts the voltage to pressure with a straight line through two calibration points. The firmware assumes
  the supply is 5 V, so a low supply on USB power makes every reading wrong.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="20" width="580" height="340" rx="8"/>
  <text x="36" y="44">Proteus ECU</text>

  <!-- 5 V supply (orange) -->
  <rect class="drive" x="330" y="70" width="190" height="48" rx="6"/>
  <text x="425" y="90" text-anchor="middle">5 V sensor supply #1</text>
  <text x="425" y="107" text-anchor="middle" class="small">also White 21 / 32</text>
  <path class="wire-drive" d="M520,94 H578"/>
  <rect class="drive" x="578" y="82" width="24" height="24" rx="3"/>
  <text x="612" y="76">White 9</text>
  <path class="wire-drive" d="M602,94 H780 V138" marker-end="url(#a)"/>
  <text x="640" y="112" class="small">+5 V</text>

  <!-- sensor -->
  <rect class="loop" x="720" y="140" width="220" height="130" rx="6"/>
  <text x="830" y="164" text-anchor="middle">MAP sensor</text>
  <text x="830" y="182" text-anchor="middle" class="small">output = fraction × supply</text>
  <text x="830" y="198" text-anchor="middle" class="small">(the fraction follows pressure)</text>
  <text x="742" y="258" class="small">+5</text>
  <text x="815" y="258" class="small">OUT</text>
  <text x="890" y="258" class="small">GND</text>

  <!-- signal back (green) -->
  <path class="wire-loop" d="M830,270 V214 M830,270 V300 H602"/>
  <rect class="loop" x="578" y="288" width="24" height="24" rx="3"/>
  <text x="612" y="282">White 13</text>
  <text x="680" y="318" class="small">signal: yellow wire · Analog Volt 1</text>

  <!-- ground -->
  <path class="wire" d="M900,270 V340 H602"/>
  <rect class="box" x="578" y="328" width="24" height="24" rx="3"/>
  <text x="680" y="354" class="small">White 1–8 · GNDA sensor ground</text>
  <path class="wire" d="M578,340 H500 V330 M484,330 H516 M490,324 H510 M496,318 H504"/>

  <!-- firmware chain -->
  <path class="wire-loop" d="M578,300 H462" marker-end="url(#a)"/>
  <rect class="loop" x="290" y="276" width="170" height="48" rx="6"/>
  <text x="375" y="296" text-anchor="middle">input divider + ADC</text>
  <text x="375" y="313" text-anchor="middle" class="small">× 1.56 → pin volts</text>
  <path class="wire-loop" d="M290,300 H262" marker-end="url(#a)"/>
  <rect class="loop" x="40" y="250" width="220" height="74" rx="6"/>
  <text x="150" y="272" text-anchor="middle">straight line, two points</text>
  <text x="150" y="290" text-anchor="middle" class="small">(V1, P1) – (V2, P2) → kPa</text>
  <text x="150" y="308" text-anchor="middle" class="small">outside the fault limits → invalid</text>

  <!-- warning (red) -->
  <rect class="safe" x="40" y="70" width="260" height="120" rx="6"/>
  <text x="170" y="94" text-anchor="middle">calibration assumes 5.0 V</text>
  <text x="170" y="116" text-anchor="middle" class="small">nothing measures the supply and</text>
  <text x="170" y="132" text-anchor="middle" class="small">corrects for it: on USB power the</text>
  <text x="170" y="148" text-anchor="middle" class="small">supply is low, the output is low,</text>
  <text x="170" y="164" text-anchor="middle" class="small">and the pressure reads low</text>
  <path class="wire-safe" d="M300,110 H328"/>
</svg>
