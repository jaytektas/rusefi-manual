<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t d">
  <title id="t">Sensor loom routing on a Proteus F7 installation</title>
  <desc id="d">Top view of an engine with a Proteus F7 at the left. The sensor loom (green) leaves the White
  connector and runs down the left and bottom of the engine to the cam, crank and knock sensors. The ECU's
  own outputs — coil packs, injectors, throttle motor, starter feed (orange) — are on the other side. The red
  dashed path is the same sensor cable taken along the top past the fuel rail, the coils and the throttle
  motor wires, which is what not to do.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 3; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 3; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>

  <!-- engine block -->
  <rect class="box" x="300" y="110" width="400" height="280" rx="8"/>
  <text x="360" y="368" class="small">engine block</text>

  <!-- noise sources -->
  <rect class="drive" x="300" y="74" width="400" height="30" rx="6"/>
  <text x="500" y="94" text-anchor="middle">fuel rail and injectors · outputs on Black 35</text>

  <rect class="drive" x="712" y="140" width="80" height="40" rx="6"/>
  <text x="752" y="164" text-anchor="middle">coil 1</text>
  <rect class="drive" x="712" y="220" width="80" height="40" rx="6"/>
  <text x="752" y="244" text-anchor="middle">coil 2</text>
  <rect class="drive" x="712" y="300" width="80" height="40" rx="6"/>
  <text x="752" y="324" text-anchor="middle">coil 3</text>
  <text x="712" y="132" class="small">coil packs · Ign outputs on Black 35</text>

  <rect class="drive" x="190" y="16" width="140" height="38" rx="6"/>
  <text x="260" y="34" text-anchor="middle">throttle body</text>
  <text x="260" y="48" text-anchor="middle" class="small">motor: Black 6 / 7</text>
  <path class="wire-drive" d="M270,54 V74"/>

  <rect class="drive" x="470" y="404" width="130" height="40" rx="6"/>
  <text x="535" y="428" text-anchor="middle">starter cable</text>

  <!-- sensors -->
  <rect class="ask" x="300" y="150" width="110" height="40" rx="6"/>
  <text x="355" y="174" text-anchor="middle">cam sensor</text>
  <rect class="ask" x="300" y="396" width="130" height="40" rx="6"/>
  <text x="365" y="412" text-anchor="middle">crank sensor</text>
  <text x="365" y="428" text-anchor="middle" class="mono">VR 1 · Black 5/13</text>
  <rect class="ask" x="560" y="252" width="130" height="40" rx="6"/>
  <text x="625" y="268" text-anchor="middle">knock sensor</text>
  <text x="625" y="284" text-anchor="middle" class="mono">Knock 1 · White 34</text>

  <!-- ECU -->
  <rect class="box" x="20" y="150" width="180" height="200" rx="8"/>
  <text x="110" y="172" text-anchor="middle">Proteus F7</text>
  <text x="32" y="196" class="small">Black 23</text>
  <text x="32" y="210" class="small">VR 1/2, digital, ETB, power</text>
  <text x="32" y="234" class="small">Black 35</text>
  <text x="32" y="248" class="small">coils, injectors, lowside</text>
  <text x="32" y="272" class="small">White 35</text>
  <text x="32" y="286" class="small">analog sensors + knock</text>

  <!-- green sensor loom -->
  <path class="wire-loop" d="M200,300 H245 V170 H300"/>
  <path class="wire-loop" d="M200,318 H262 V416 H300"/>
  <path class="wire-loop" d="M200,336 H280 V462 H625 V292"/>

  <!-- red wrong route -->
  <path class="wire-safe" d="M200,170 H218 V62 H700 V240 H652"/>
  <text x="400" y="56" class="small">the same cable along the top — past the rail, the coils, the throttle motor</text>

  <text x="20" y="484" class="small">green = sensor loom (its own return on a White GNDA pin) · orange = what the ECU switches · red dashed = the route to avoid</text>
</svg>
