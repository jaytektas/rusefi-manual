<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Crank and cam signals over one 720 degree engine cycle</title>
  <desc id="d">A 60-2 crank wheel turns twice per engine cycle, so its gap and sync point appear at 0 and 360 degrees and the two crank revolutions look identical. A single-tooth cam sensor produces one pulse per cycle, in the first revolution, which tells rusEFI which revolution is which. Top dead centre of cylinders 1, 3, 4 and 2 follow 180 degrees apart. Without the cam, rusEFI fires coil pairs 1 and 4, 2 and 3 together (wasted spark).</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <style>
    .sig { stroke: #2e9d4f; stroke-width: 1.5; fill: none; }
    .sig2 { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .tdc { stroke: #e8710a; stroke-width: 2; fill: none; }
    .guide { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .drive-t { fill: #e8710a; } .loop-t { fill: #2e9d4f; } .ask-t { fill: #2563eb; }
    .bracket { stroke: #6b7280; stroke-width: 2; fill: none; }
    .bracket-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .drive-t { fill: #fdba74; } .loop-t { fill: #86efac; } .ask-t { fill: #93c5fd; }
      .sig, .sig2 { stroke: #86efac; } .bracket { stroke: #9ca3af; } .bracket-ask { stroke: #93c5fd; }
    }
  </style>
