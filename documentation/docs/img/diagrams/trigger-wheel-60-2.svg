<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">A 60-2 trigger wheel and the signal it makes</title>
  <desc id="d">A crank wheel with 58 teeth on a 6 degree pitch and a gap where two teeth are missing. The first tooth after the gap is the sync point. The angle from the sync point to the tooth that is at the sensor when cylinder 1 is at top dead centre is the Trigger Angle Advance. On the right, the sensor signal: evenly spaced pulses, then a gap three times as long, so the ratio of tooth times jumps to about 3 at the sync point.</desc>
