  <text x="496" y="376">How rusEFI finds the sync point on a 60-2 wheel</text>
  <text x="496" y="400" class="small">• ratio of this tooth time to the previous one must be 2.25 – 3.75</text>
  <text x="496" y="424" class="small">• and the previous ratio must be 0.75 – 1.25 (a normal tooth)</text>
  <text x="496" y="448" class="small">• then exactly 58 teeth must arrive before the next gap</text>
  <text x="496" y="472" class="small">• engine angle = angle since the sync point − Trigger Angle Advance</text>
</svg>
