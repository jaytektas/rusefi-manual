<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">How the measured cam angle is built</title>
  <desc id="d">The crank trigger gives the engine phase. The cam tooth arrives at an angle inside that
  720 degree cycle. The VVT offset minus that angle is the measured cam position, wrapped to plus or
  minus 360 degrees. If the cam tooth has not arrived for a second, or the engine phase is not
  synchronised, the position is not usable and the controller has no feedback.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="loop" x="20" y="30" width="210" height="56" rx="6"/>
  <text x="125" y="54" text-anchor="middle">crank trigger synced</text>
  <text x="125" y="72" text-anchor="middle" class="small">engine phase in the 720° cycle</text>

  <path class="wire-loop" d="M230,58 H258" marker-end="url(#a)"/>

  <rect class="loop" x="260" y="30" width="250" height="56" rx="6"/>
  <text x="385" y="54" text-anchor="middle">cam tooth arrives at angle X</text>
  <text x="385" y="72" text-anchor="middle" class="small">X is measured in engine degrees</text>

  <path class="wire-loop" d="M510,58 H538" marker-end="url(#a)"/>

  <rect class="loop" x="540" y="30" width="310" height="56" rx="6"/>
  <text x="695" y="54" text-anchor="middle">measured angle = offset − X</text>
  <text x="695" y="72" text-anchor="middle" class="small">wrapped to ±360°; Honda K intake ±180°</text>

  <rect class="ask" x="540" y="150" width="310" height="56" rx="6"/>
  <text x="695" y="174" text-anchor="middle">VVT offset bank 1 intake</text>
  <text x="695" y="192" text-anchor="middle" class="small">vvtOffsets1 — set so the rest position reads 0°</text>
  <path class="wire-ask" d="M695,150 V88" marker-end="url(#a)"/>

  <rect class="box" x="20" y="150" width="490" height="56" rx="6"/>
  <text x="265" y="174" text-anchor="middle">Cam for engine sync resolution</text>
  <text x="265" y="192" text-anchor="middle" class="small">only that one cam input is allowed to trim the crank zero</text>

  <path class="wire-loop" d="M850,58 H900 V298 H852" marker-end="url(#a)"/>

  <rect class="loop" x="540" y="270" width="310" height="56" rx="6"/>
  <text x="695" y="294" text-anchor="middle">VVT: bank 1 intake</text>
  <text x="695" y="312" text-anchor="middle" class="mono">the angle the PID closes on</text>

  <rect class="safe" x="120" y="270" width="340" height="56" rx="6"/>
  <text x="290" y="294" text-anchor="middle">tooth missing for 1 s, or phase lost</text>
  <text x="290" y="312" text-anchor="middle" class="small">no usable angle → duty 0 % and the PID resets</text>
  <path class="wire-safe" d="M460,298 H538" marker-end="url(#a)"/>

  <rect class="safe" x="20" y="350" width="920" height="46" rx="6"/>
  <text x="480" y="372" text-anchor="middle" class="small">the same cam input also gives the ECU the engine's phase, which is what makes sequential fuel and spark possible</text>
  <text x="480" y="388" text-anchor="middle" class="small">cam and crank wheel decoding is covered in the Trigger chapter</text>
</svg>
