<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d">
  <title id="t">Sensor supplies and sensor returns on Proteus</title>
  <desc id="d">Each sensor gets its supply, its signal and its own return wire, and each wire lands on a named Proteus pin. A MAP sensor takes +5 V supply 1 on White 9, signals White 13 Analog Volt 1 and returns to White 1 GNDA. A pedal sensor with two tracks takes +5 V supply 2 on White 10, signals White 17 and White 16, and returns to White 23. A Hall trigger sensor takes 5 V or protected 12 V, signals Digital 1 on Black 10, and returns to White 2 GNDA. The red panel warns that 12 V must never reach a 5 V sensor and that sensor grounds never go to the engine block.</desc>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .small { font-size: 11px; fill: #4b5563; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #6b7280; stroke-width: 2; }
    .ask { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .drive { fill: #fff7ed; stroke: #e8710a; stroke-width: 2; }
    .loop { fill: #f0fdf4; stroke: #2e9d4f; stroke-width: 2; }
    .safe { fill: #fef2f2; stroke: #c8412d; stroke-width: 2; }
    .wire { stroke: #6b7280; stroke-width: 2; fill: none; }
    .wire-ask { stroke: #2563eb; stroke-width: 2; fill: none; }
    .wire-drive { stroke: #e8710a; stroke-width: 2; fill: none; }
    .wire-loop { stroke: #2e9d4f; stroke-width: 2; fill: none; }
    .wire-safe { stroke: #c8412d; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; } .small, .mono { fill: #9ca3af; }
      .box { fill: #1f2937; stroke: #9ca3af; } .ask { fill: #172554; } .drive { fill: #431407; }
      .loop { fill: #052e16; } .safe { fill: #450a0a; } .wire { stroke: #9ca3af; } .arrow { fill: #9ca3af; }
    }
  </style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker></defs>

  <!-- ECU: each row is the pin a wire lands on -->
  <rect class="box" x="600" y="20" width="340" height="392" rx="8"/>
  <text x="770" y="42" text-anchor="middle">Proteus — where each wire lands</text>
  <line class="wire" x1="600" y1="134" x2="940" y2="134"/>
  <line class="wire" x1="600" y1="280" x2="940" y2="280"/>
  <text x="614" y="62" class="mono">White 9   +5 V supply #1</text>
  <text x="614" y="86" class="mono">White 13  Analog Volt 1  (MAP)</text>
  <text x="614" y="110" class="mono">White 1   GNDA</text>
  <text x="614" y="190" class="mono">White 10  +5 V supply #2</text>
  <text x="614" y="214" class="mono">White 17  Analog Volt 9  (PPS 1)</text>
  <text x="614" y="238" class="mono">White 16  Analog Volt 7  (PPS 2)</text>
  <text x="614" y="262" class="mono">White 23  GNDA</text>
  <text x="614" y="318" class="mono">White 9 or 11  supply for the sensor</text>
  <text x="614" y="342" class="mono">Black 10  Digital 1</text>
  <text x="614" y="366" class="mono">White 2   GNDA</text>
  <text x="614" y="394" class="small">1-8, 23, 29 are all GNDA sensor ground</text>

  <!-- MAP sensor -->
  <rect class="ask" x="20" y="44" width="200" height="90" rx="6"/>
  <text x="120" y="70" text-anchor="middle">MAP sensor</text>
  <text x="120" y="88" text-anchor="middle" class="small">3 wires, ratiometric</text>
  <text x="120" y="106" text-anchor="middle" class="small">signal ≈ 0.5–4.5 V</text>
  <path class="wire-drive" d="M220,58 H598" marker-end="url(#a)"/>
  <text x="300" y="54" class="small">+5 V supply 1 (orange)</text>
  <path class="wire-ask" d="M220,82 H598" marker-end="url(#a)"/>
  <text x="300" y="78" class="small">signal (blue)</text>
  <path class="wire" d="M220,106 H598"/>
  <text x="300" y="124" class="small">return, its own wire (grey)</text>

  <!-- Pedal sensor -->
  <rect class="ask" x="20" y="170" width="200" height="100" rx="6"/>
  <text x="120" y="196" text-anchor="middle">Pedal, two tracks</text>
  <text x="120" y="214" text-anchor="middle" class="small">4 wires: 5 V, two signals,</text>
  <text x="120" y="232" text-anchor="middle" class="small">one return</text>
  <path class="wire-drive" d="M220,186 H598" marker-end="url(#a)"/>
  <text x="300" y="182" class="small">+5 V supply 2 — a different supply from MAP</text>
  <path class="wire-ask" d="M220,210 H598" marker-end="url(#a)"/>
  <text x="300" y="206" class="small">track 1, rising as the pedal moves</text>
  <path class="wire-ask" d="M220,234 H598" marker-end="url(#a)"/>
  <text x="300" y="230" class="small">track 2, falling</text>
  <path class="wire" d="M220,258 H598"/>
  <text x="300" y="276" class="small">return</text>

  <!-- Hall sensor -->
  <rect class="ask" x="20" y="300" width="200" height="90" rx="6"/>
  <text x="120" y="326" text-anchor="middle">Hall trigger sensor</text>
  <text x="120" y="344" text-anchor="middle" class="small">5 V or 12 V supply,</text>
  <text x="120" y="362" text-anchor="middle" class="small">square-wave signal</text>
  <path class="wire-drive" d="M220,314 H598" marker-end="url(#a)"/>
  <text x="300" y="310" class="small">supply</text>
  <path class="wire-ask" d="M220,338 H598" marker-end="url(#a)"/>
  <text x="300" y="334" class="small">signal</text>
  <path class="wire" d="M220,362 H598"/>
  <text x="300" y="380" class="small">return</text>

  <!-- safety note -->
  <rect class="safe" x="20" y="424" width="920" height="72" rx="6"/>
  <text x="480" y="448" text-anchor="middle">5 V sensors live on the two 5 V supplies only: 12 V on a sensor's supply or signal pin destroys the</text>
  <text x="480" y="466" text-anchor="middle">input. Never join supply #1 to #2 and never feed an outside 5 V source into them. Ground a sensor to a</text>
  <text x="480" y="484" text-anchor="middle">White GNDA pin, never to the block or a chassis bolt — see the Power and grounds chapter.</text>
</svg>
