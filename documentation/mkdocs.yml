      - Wiring basics: part2/wiring-basics.md
      - Power, grounds and ground loops: part2/power-grounds.md
      - Shielding and noise: part2/shielding-noise.md
      - Wiring sensors: part2/wiring-sensors.md
      - Wiring outputs: part2/wiring-outputs.md
      - CAN bus: part2/can-bus.md
  - Part III — Configuring the engine:
