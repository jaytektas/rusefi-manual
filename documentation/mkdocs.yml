  - Read this first — safety and disclaimer: safety.md
  - Part 0 — About rusEFI:
      - part0/index.md
      - What rusEFI is: part0/about-rusefi.md
      - Getting help: part0/getting-help.md
  - Part I — Getting started:
      - part1/index.md
      - How EFI works: part1/how-efi-works.md
      - The rusEFI system: part1/rusefi-system.md
      - Your two tools: part1/two-tools.md
      - Installing the software: part1/installing.md
      - Flashing firmware: part1/flashing-firmware.md
      - First connection: part1/first-connection.md
      - Quick start: part1/quick-start.md
  - Part II — Hardware and wiring:
