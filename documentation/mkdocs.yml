      - Engine and vehicle basics: part3/engine-basics.md
      - The trigger system: part3/trigger.md
      - Sensors and calibration: part3/sensors.md
      - Outputs and pins: part3/outputs.md
      - Fuel: part3/fuel.md
      - Ignition: part3/ignition.md
      - Cranking: part3/cranking.md
      - Idle: part3/idle.md
      - Electronic throttle: part3/electronic-throttle.md
      - Closed-loop lambda: part3/closed-loop-lambda.md
      - Boost: part3/boost.md
      - Cam and valve control: part3/vvt.md
      - Launch, shift and traction: part3/launch-traction.md
      - Limits and engine protection: part3/limits-protection.md
      - Knock: part3/knock.md
